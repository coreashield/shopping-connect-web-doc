name: IndexNow daily (recent URLs)

# 네이버 로봇은 하루 50~150페이지만 수집한다. 신규·변경 URL 을 매일 IndexNow 로 먼저 알린다.
#   대상: 3개 호스트의 라이브 사이트맵에서 lastmod 가 최근 N일(기본 2일)인 URL.
#   콘텐츠 발행은 별도 흐름이라 배포 시점이 아니라 시간 기준(cron)으로 돈다.
on:
  schedule:
    - cron: '30 1 * * *'   # 매일 10:30 KST
  workflow_dispatch:
    inputs:
      days:
        description: '최근 N일 lastmod 만 제출'
        required: false
        default: '2'

env:
  TZ: Asia/Seoul

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit recent URLs
        run: node scripts/indexnow_live.mjs --days "${{ github.event.inputs.days || '2' }}"
